  <style>
    :root {
      /* Paleta oficial BioFrame */
      --verde: #12FF46;
      --negro: #090909;
      --blanco: #FFFFFF;

      --vidrio: rgba(255, 255, 255, 0.12);
      --vidrio-hover: rgba(255, 255, 255, 0.2);
      --borde: rgba(255, 255, 255, 0.16);
      --radio: 10px;
      --corchete: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--negro);
      color: var(--blanco);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo fijo en una capa propia: background-attachment: fixed falla en iOS */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 70% 45% at 50% 30%, rgba(9, 9, 9, 0.55), transparent 70%),
        linear-gradient(rgba(9, 9, 9, 0.25), rgba(9, 9, 9, 0.45)),
        url("assets/bg.webp") center / cover no-repeat,
        var(--negro);
    }

    main {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: clamp(56px, 12vh, 104px) 16px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: entrada 600ms cubic-bezier(.2, .7, .2, 1) both;
    }

    @keyframes entrada {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--negro);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 6px rgba(9, 9, 9, 0.35), 0 0 40px rgba(18, 255, 70, 0.18);
      overflow: hidden;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin: 20px 0 6px;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .lema {
      margin: 0;
      max-width: 21em;
      font-size: 1rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
      text-wrap: balance;
    }

    .enlaces {
      list-style: none;
      margin: 32px 0 0;
      padding: 0;
      width: 100%;
      display: grid;
      gap: 14px;
    }

    .enlace {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 12px 60px;
      border-radius: var(--radio);
      background: var(--vidrio);
      border: 1px solid var(--borde);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      color: var(--blanco);
      font-size: 0.975rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 180ms ease, transform 180ms ease, border-color 180ms ease;
    }

    .enlace svg {
      position: absolute;
      left: 20px;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translateY(-50%);
      fill: currentColor;
    }

    /* Corchetes del logo: enmarcan el botón activo */
    .enlace::before,
    .enlace::after {
      content: "";
      position: absolute;
      width: var(--corchete);
      height: var(--corchete);
      border: 0 solid var(--verde);
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .enlace::before {
      top: -5px;
      right: -5px;
      border-top-width: 2px;
      border-right-width: 2px;
      transform: translate(4px, -4px);
    }

    .enlace::after {
      bottom: -5px;
      left: -5px;
      border-bottom-width: 2px;
      border-left-width: 2px;
      transform: translate(-4px, 4px);
    }

    /* Solo con cursor: en pantallas táctiles el hover se queda pegado tras tocar */
    @media (hover: hover) {
      .enlace:hover {
        background: var(--vidrio-hover);
        border-color: rgba(255, 255, 255, 0.28);
        transform: translateY(-1px);
      }

      .enlace:hover::before,
      .enlace:hover::after {
        opacity: 1;
        transform: none;
      }
    }

    .enlace:active {
      background: var(--vidrio-hover);
      transform: scale(0.99);
    }

    /* Foco de teclado: solo el contorno, para no confundirse con el hover */
    .enlace:focus-visible {
      outline: 2px solid var(--verde);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .enlace, .enlace::before, .enlace::after { transition: none; }
    }
  </style>
